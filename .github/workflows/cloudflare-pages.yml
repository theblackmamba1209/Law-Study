# Optional: deploy every push to main to Cloudflare Pages.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (with "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID.
# If you connect the repository in the Cloudflare dashboard instead, you can delete this file.
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for Cloudflare secrets
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "ready=$([ -n "$TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'yes'
      - name: Deploy
        if: steps.check.outputs.ready == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sinag-codal --branch=main
